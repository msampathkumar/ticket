[project]
site_url = "https://msampathkumar.github.io/ticket/"
site_name = "ticket (tk)"
site_description = "Minimal, offline task tracker with dependency intelligence for humans and AI agents."
site_author = "Sampath Kumar & contributors"
copyright = "Copyright &copy; 2026 Sampath Kumar"
repo_url = "https://github.com/msampathkumar/ticket"
repo_name = "msampathkumar/ticket"

nav = [
  { "Overview" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
  ] },
  { "Developer Workflows" = [
    { "Solo CLI Workflow" = "workflows/cli-solo.md" },
    { "Web UI & Kanban Workflow" = "workflows/webui-team.md" },
    { "SCION Task Force Workflow" = "workflows/scion-taskforce.md" },
  ] },
  { "Core CLI" = [
    { "Command Reference" = "core-cli/commands.md" },
    { "Dependency Intelligence" = "core-cli/dependencies.md" },
  ] },
  { "Interactive Web UI" = [
    { "Overview & Kanban" = "web-ui/overview.md" },
    { "Daemon Management" = "web-ui/daemons.md" },
  ] },
  { "Plugins & Ecosystem" = [
    { "Plugin Architecture" = "plugins/architecture.md" },
    { "GitHub Sync" = "plugins/github.md" },
    { "SCION Task Force" = "plugins/scion-taskforce.md" },
  ] },
  { "AI Agent Integration" = [
    { "Agent Execution Loop" = "agents/workflow.md" },
    { "Agent Skill" = "agents/agent-skill.md" },
    { "LLM Context (llms.txt)" = "agents/llms-txt.md" },
  ] },
  { "Specifications" = [
    { "System Spec" = "SPEC.md" },
    { "Agent Spec" = "AGENTS.md" },
    { "Plugin Standard" = "PLUGIN_SPEC.md" },
  ] },
]

[project.theme]
favicon = "images/favicon.svg"
logo = "images/logo.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
